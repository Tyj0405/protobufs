syntax = "proto3";

package harbour.shipping.movement.v1;

import "buf/validate/validate.proto";
import "harbour/types/v1/file.proto";

message AttachedShippingMovementItem {
  option (buf.validate.message).cel = {
    id: "shipping_movement_item.unique_files"
    message: "each attachment file may only appear once"
    expression: "this.images.map(image, image.file_id).unique()"
  };

  int64 cargo_id = 1 [(buf.validate.field).int64.gt = 0];
  optional string remarks = 2 [(buf.validate.field).string.max_len = 2000];
  repeated harbour.types.v1.ImageEvidenceAttachment images = 3;
}
