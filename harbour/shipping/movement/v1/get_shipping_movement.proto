syntax = "proto3";

package harbour.shipping.movement.v1;

import "harbour/types/v1/cargo.proto";
import "harbour/types/v1/shipping.proto";

message ShippingMovementSummary {
  harbour.types.v1.ShippingMovement shipping_movement = 1;
  repeated harbour.types.v1.CargoReference items = 2;
  uint32 evidence_count = 3;
}

message ShippingMovementDetails {
  harbour.types.v1.ShippingMovement shipping_movement = 1;
  repeated harbour.types.v1.ShippingMovementItem items = 2;
}
