syntax = "proto3";

package harbour.shipping.common.v1;

import "buf/validate/validate.proto";
import "harbour/types/v1/file.proto";

message UpdateShippingItem {
  optional int64 cargo_id = 1 [(buf.validate.field).int64.gt = 0];
  optional string remarks = 2 [(buf.validate.field).string.max_len = 2000];
  repeated harbour.types.v1.ImageEvidenceAttachment images = 3;
}
