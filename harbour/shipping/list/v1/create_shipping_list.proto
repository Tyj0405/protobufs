syntax = "proto3";

package harbour.shipping.list.v1;

import "buf/validate/validate.proto";
import "harbour/types/v1/file.proto";

message CreateShippingListInfo {
  int64 port_id = 1 [(buf.validate.field).int64.gt = 0];
  int64 company_id = 2 [(buf.validate.field).int64.gt = 0];
  int64 shipping_company_id = 3 [(buf.validate.field).int64.gt = 0];
  optional string remarks = 4 [(buf.validate.field).string.max_len = 2000];
  repeated AttachedShippingRoute routes = 5;
  repeated AttachedShippingListItem items = 6 [(buf.validate.field).repeated.min_items = 1];
}

message AttachedShippingRoute {
  int32 order_no = 1 [(buf.validate.field).int32.gt = 0];
  int64 address_id = 2 [(buf.validate.field).int64.gt = 0];
  optional string callsign = 3 [(buf.validate.field).string.max_len = 200];
}

message AttachedShippingListItem {
  int64 cargo_id = 1 [(buf.validate.field).int64.gt = 0];
  optional string remarks = 2 [(buf.validate.field).string.max_len = 2000];
  repeated harbour.types.v1.ImageEvidenceAttachment images = 3;
}
