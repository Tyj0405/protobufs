syntax = "proto3";

package harbour.shipping.list.v1;

import "harbour/types/v1/file.proto";

message CreateShippingListInfo {
  int64 port_id = 1;
  int64 company_id = 2;
  int64 shipping_company_id = 3;
  optional string remarks = 4;
  repeated AttachedShippingRoute routes = 5;
  repeated AttachedShippingListItem items = 6;
}

message AttachedShippingRoute {
  int32 order_no = 1;
  int64 address_id = 2;
  optional string callsign = 3;
}

message AttachedShippingListItem {
  int64 cargo_id = 1;
  optional string remarks = 2;
  repeated harbour.types.v1.ImageEvidenceAttachment images = 3;
}
