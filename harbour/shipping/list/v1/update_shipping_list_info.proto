syntax = "proto3";

package harbour.shipping.list.v1;

import "buf/validate/validate.proto";

message UpdateShippingListInfo {
  optional int64 port_id = 1 [(buf.validate.field).int64.gt = 0];
  optional int64 company_id = 2 [(buf.validate.field).int64.gt = 0];
  optional int64 shipping_company_id = 3 [(buf.validate.field).int64.gt = 0];
  optional string remarks = 4 [(buf.validate.field).string.max_len = 2000];
}
