syntax = "proto3";

package harbour.file.v1;

import "buf/validate/validate.proto";
import "harbour/file/v1/upload_file.proto";

service FileService {
  rpc UploadFile(stream UploadFileRequest) returns (stream UploadFileResponse) {}
  rpc ViewFile(ViewFileRequest) returns (stream ViewFileResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
}

message UploadFileRequest {
  oneof request {
    UploadFileInfo info = 1;
    bytes content = 2;
  }
}

message UploadFileResponse {
  oneof response {
    uint64 uploaded_kb = 1;
    int64 created_id = 2;
  }
}

message ViewFileRequest {
  int64 file_id = 1 [(buf.validate.field).int64.gt = 0];
  uint64 chunk_size_kb = 2 [(buf.validate.field).uint64.gt = 0];
}

message ViewFileResponse {
  bytes content = 1;
}