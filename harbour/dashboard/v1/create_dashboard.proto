syntax = "proto3";

package harbour.dashboard.v1;

import "buf/validate/validate.proto";
import "google/protobuf/struct.proto";

message CreateDashboard {
  option (buf.validate.message).cel = {
    id: "dashboard.createdashboard.unique_component"
    message: "each layout component must be unique"
    expression: "this.layouts.map(layout, layout.component_id).unique()"
  };
  option (buf.validate.message).cel = {
    id: "dashboard.createdashboard.unique_position"
    message: "each layout position must be unique"
    expression: "this.layouts.map(layout, layout.position).unique()"
  };

  string name = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 200
    pattern: "(?s).*[^[:space:]].*"
  }];
  int64 port_id = 2 [(buf.validate.field).int64.gt = 0];
  // An empty list is valid and hides all blocks.
  repeated DashboardLayoutInput layouts = 3;
}

message DashboardLayoutInput {
  int64 component_id = 1 [(buf.validate.field).int64.gt = 0];
  string title = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 200
    pattern: "(?s).*[^[:space:]].*"
  }];
  // Zero-based ordering; gaps are permitted.
  uint32 position = 3;
  google.protobuf.Struct data = 4;
}
