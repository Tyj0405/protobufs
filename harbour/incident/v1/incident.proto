syntax = "proto3";

package harbour.incident.v1;

import "google/protobuf/timestamp.proto";
import "harbour/common/v1/common.proto";

service IncidentService {
  // Returns incidents for the administrator list and staff mobile list.
  rpc ListIncidents(ListIncidentsRequest) returns (ListIncidentsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // Returns one incident together with its complete status-log history.
  rpc GetIncident(GetIncidentRequest) returns (GetIncidentResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // Creates an incident and its initial Open log for the authenticated user.
  rpc CreateIncident(CreateIncidentRequest) returns (CreateIncidentResponse) {}

  // Adds a new status log. The newest log becomes the latest incident status.
  rpc AppendIncidentLog(AppendIncidentLogRequest) returns (AppendIncidentLogResponse) {}
}

message ListIncidentsRequest {
  int64 port_id = 1;

  // Filters by the status of the newest incident log.
  optional IncidentStatus latest_status = 2;
  optional string query = 3;

  // A general user filter. The backend must still enforce access permissions.
  optional int64 created_by_user_id = 4;
  .harbour.common.v1.PaginationRequest pagination = 5;
}

message ListIncidentsResponse {
  repeated Incident incidents = 1;
  .harbour.common.v1.PaginationResponse pagination = 2;
}

message GetIncidentRequest {
  int64 incident_id = 1;
}

message GetIncidentResponse {
  IncidentDetails details = 1;
}

message CreateIncidentRequest {
  string description = 1;
  int64 port_id = 2;

  oneof specific_location_id {
    int64 berth_id = 3;
    int64 wharf_id = 4;
    int64 terminal_id = 5;
  }

  repeated IncidentImageInput images = 6;
}

message CreateIncidentResponse {
  IncidentDetails details = 1;
}

message AppendIncidentLogRequest {
  int64 incident_id = 1;
  IncidentStatus status = 2;
  string description = 3;
  optional string remarks = 4;
  repeated IncidentImageInput images = 5;
}

message AppendIncidentLogResponse {
  IncidentLog log = 1;
  IncidentStatus latest_status = 2;
}

enum IncidentStatus {
  INCIDENT_STATUS_UNSPECIFIED = 0;
  INCIDENT_STATUS_OPEN = 1;
  INCIDENT_STATUS_INVESTIGATING = 2;
  INCIDENT_STATUS_RESOLVING = 3;
  INCIDENT_STATUS_RESOLVED = 4;
  INCIDENT_STATUS_NOT_PLANNED = 5;
}

message Incident {
  int64 id = 1;
  string description = 2;
  .harbour.common.v1.LocationReference port = 3;

  oneof specific_location {
    .harbour.common.v1.LocationReference berth = 4;
    .harbour.common.v1.LocationReference wharf = 5;
    .harbour.common.v1.LocationReference terminal = 6;
  }

  .harbour.common.v1.UserReference created_by = 7;
  google.protobuf.Timestamp created_at = 8;

  IncidentStatus latest_status = 9;
  uint32 evidence_count = 10;
}

message IncidentDetails {
  Incident incident = 1;
  repeated IncidentLog logs = 2;
}

message IncidentLog {
  int64 id = 1;
  IncidentStatus status = 2;
  string description = 3;
  optional string remarks = 4;
  google.protobuf.Timestamp created_at = 5;
  repeated IncidentLogImage images = 6;
}

message IncidentLogImage {
  .harbour.common.v1.FileReference file = 1;
  optional string remarks = 2;
}

message IncidentImageInput {
  int64 file_id = 1;
  optional string remarks = 2;
}
