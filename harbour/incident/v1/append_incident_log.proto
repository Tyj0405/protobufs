syntax = "proto3";

package harbour.incident.v1;

import "harbour/types/v1/file.proto";
import "harbour/types/v1/incident.proto";

message AppendIncidentLog {
  harbour.types.v1.IncidentStatus status = 1;
  string description = 2;
  optional string remarks = 3;
  repeated harbour.types.v1.ImageEvidenceAttachment images = 4;
}
