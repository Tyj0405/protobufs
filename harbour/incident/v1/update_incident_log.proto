syntax = "proto3";

package harbour.incident.v1;

import "harbour/types/v1/file.proto";
import "harbour/types/v1/incident.proto";

message UpdateIncidentLog {
  optional harbour.types.v1.IncidentStatus status = 1;
  optional string description = 2;
  optional string remarks = 3;

  // Omit to keep the current images. Provide an empty items list to clear them.
  IncidentLogImageReplacement image_replacement = 4;
}

message IncidentLogImageReplacement {
  repeated harbour.types.v1.ImageEvidenceAttachment items = 1;
}
