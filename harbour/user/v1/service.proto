syntax = "proto3";

package harbour.user.v1;

import "buf/validate/validate.proto";
import "google/protobuf/field_mask.proto";
import "harbour/types/v1/pagination.proto";
import "harbour/types/v1/user.proto";
import "harbour/user/v1/get_user.proto";
import "harbour/user/v1/register_user.proto";

service UserService {
  rpc ListUsers(ListUsersRequest) returns (ListUsersResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  rpc GetUser(GetUserRequest) returns (GetUserResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  rpc CreateUser(CreateUserRequest) returns (CreateUserResponse) {}
  rpc UpdateUser(UpdateUserRequest) returns (UpdateUserResponse) {
    option idempotency_level = IDEMPOTENT;
  }
  rpc UpdateUserPassword(UpdateUserPasswordRequest) returns (UpdateUserPasswordResponse) {}
  rpc DeleteUser(DeleteUserRequest) returns (DeleteUserResponse) {
    option idempotency_level = IDEMPOTENT;
  }

  rpc UpdateUserRoles(UpdateUserRolesRequest) returns (UpdateUserRolesResponse) {
    option idempotency_level = IDEMPOTENT;
  }
}

message ListUsersRequest {
  optional string query = 1;
  repeated int64 role_ids = 2 [(buf.validate.field).repeated.items.int64.gt = 0];
  harbour.types.v1.PaginationRequest pagination = 3 [(buf.validate.field).required = true];
}

message ListUsersResponse {
  repeated UserSummary results = 1;
  harbour.types.v1.PaginationResponse pagination = 2;
}

message GetUserRequest {
  int64 id = 1 [(buf.validate.field).int64.gt = 0];
}

message GetUserResponse {
  UserDetails info = 1;
}

message CreateUserRequest {
  RegisterUser info = 1 [(buf.validate.field).required = true];
}

message CreateUserResponse {
  int64 created_id = 1;
}

message UpdateUserRequest {
  harbour.types.v1.User info = 1 [(buf.validate.field).required = true];
  google.protobuf.FieldMask update_mask = 2 [(buf.validate.field).cel = {
    id: "valid_field_mask"
    message: "a field mask path must be one of username, email, display_name, or phone_number"
    expression: "this.paths.all(path, path in ['username', 'email', 'display_name', 'phone_number'])"
  }];
}

message UpdateUserResponse {}

message UpdateUserPasswordRequest {
  int64 user_id = 1 [(buf.validate.field).int64.gt = 0];
  string password = 2 [(buf.validate.field).string.min_len = 8];
}

message UpdateUserPasswordResponse {}

message DeleteUserRequest {
  int64 id = 1 [(buf.validate.field).int64.gt = 0];
}

message DeleteUserResponse {}

message UpdateUserRolesRequest {
  int64 user_id = 1 [(buf.validate.field).int64.gt = 0];
  repeated int64 role_ids = 2 [(buf.validate.field).repeated.items.int64.gt = 0];
}

message UpdateUserRolesResponse {}
