syntax = "proto3";

package harbour.address.v1;

import "buf/validate/validate.proto";
import "google/protobuf/field_mask.proto";
import "harbour/types/v1/address.proto";

service AddressService {
  rpc UpdateAddress(UpdateAddressRequest) returns (UpdateAddressResponse) {}
}

message UpdateAddressRequest {
  harbour.types.v1.Address info = 1 [(buf.validate.field).required = true];
  google.protobuf.FieldMask update_mask = 2 [(buf.validate.field).cel = {
    id: "valid_field_mask"
    message: "a field mask path must be one of unit_no, address_1, address_2, address_3, city, state, postcode, country_code, or coordinate"
    expression: "this.paths.all(path, path in ['unit_no', 'address_1', 'address_2', 'address_3', 'city', 'state', 'postcode', 'country_code', 'coordinate'])"
  }];
}

message UpdateAddressResponse {}
