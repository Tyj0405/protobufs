syntax = "proto3";

package harbour.notification.v1;

import "buf/validate/validate.proto";

message NotificationRecipient {
  oneof target {
    option (buf.validate.oneof).required = true;

    // Sends to one user.
    int64 user_id = 1 [(buf.validate.field).int64.gt = 0];
    // Sends to every user assigned to this role.
    int64 role_id = 3 [(buf.validate.field).int64.gt = 0];
  }

  bool is_important = 2;
}

// Sends to every user in the current tenant. This is separate from the
// repeated recipient list because a request can contain at most one broadcast.
message AllUsersNotificationRecipient {
  bool is_important = 1;
}

message NotificationRecipientRole {
  int64 id = 1;
  string name = 2;
  uint32 user_count = 3;
}
