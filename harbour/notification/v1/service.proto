syntax = "proto3";

package harbour.notification.v1;

import "harbour/types/v1/pagination.proto";
import "harbour/types/v1/notification.proto";
import "harbour/notification/v1/get_notification.proto";
import "harbour/notification/v1/dispatch_notification.proto";

// UserNotificationService contains operations available to an authenticated
// notification recipient.
service UserNotificationService {
  // Returns notifications dispatched to the authenticated user.
  rpc ListMyNotifications(ListMyNotificationsRequest) returns (ListMyNotificationsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // Marks one of the authenticated user's notifications as read.
  rpc MarkNotificationRead(MarkNotificationReadRequest) returns (MarkNotificationReadResponse) {}
}

// AdminNotificationService contains notification management operations that
// require administrator access.
service AdminNotificationService {
  // Returns notifications created for management purposes.
  rpc ListNotifications(ListNotificationsRequest) returns (ListNotificationsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // Returns one notification and all of its dispatch records.
  rpc GetNotification(GetNotificationRequest) returns (GetNotificationResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // Creates a notification and dispatches it to the first group of recipients
  // in one operation.
  rpc CreateNotification(CreateNotificationRequest) returns (CreateNotificationResponse) {}

  // Dispatches an existing notification to additional users.
  rpc DispatchNotification(DispatchNotificationRequest) returns (DispatchNotificationResponse) {}
}

message ListMyNotificationsRequest {
  // When present, returns only read or only unread notifications.
  optional bool read = 1;
  optional bool is_important = 2;
  harbour.types.v1.PaginationRequest pagination = 3;
}

message ListMyNotificationsResponse {
  repeated harbour.types.v1.UserNotification results = 1;
  harbour.types.v1.PaginationResponse pagination = 2;
}

message MarkNotificationReadRequest {
  int64 notification_id = 1;
}

message MarkNotificationReadResponse {}

message ListNotificationsRequest {
  optional string query = 1;
  repeated int64 created_by_user_id = 2;
  harbour.types.v1.PaginationRequest pagination = 3;
}

message ListNotificationsResponse {
  repeated NotificationSummary notifications = 1;
  harbour.types.v1.PaginationResponse pagination = 2;
}

message GetNotificationRequest {
  int64 notification_id = 1;
}

message GetNotificationResponse {
  NotificationDetails details = 1;
}

message CreateNotificationRequest {
  string title = 1;
  string content = 2;

  // The first group of users who should receive the notification. The backend
  // creates both the notification and these dispatch records transactionally.
  repeated NotificationRecipient recipients = 3;
}

message CreateNotificationResponse {
  int64 created_id = 1;
}

message DispatchNotificationRequest {
  int64 notification_id = 1;

  // Additional recipients. A user who already received this notification must
  // not be inserted again because the database uses a composite primary key.
  repeated NotificationRecipient recipients = 2;
}

message DispatchNotificationResponse {}
