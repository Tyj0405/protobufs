syntax = "proto3";

package harbour.report.v1;

import "google/protobuf/timestamp.proto";
import "harbour/incident/v1/get_incident.proto";
import "harbour/shipping/movement/v1/get_shipping_movement.proto";
import "harbour/task/v1/get_task.proto";
import "harbour/types/v1/incident.proto";
import "harbour/types/v1/shipping.proto";
import "harbour/types/v1/task.proto";

enum OperationalRecordType {
  OPERATIONAL_RECORD_TYPE_UNSPECIFIED = 0;
  OPERATIONAL_RECORD_TYPE_CARGO_MOVEMENT = 1;
  OPERATIONAL_RECORD_TYPE_TASK = 2;
  OPERATIONAL_RECORD_TYPE_INCIDENT = 3;
}

// Tenant-wide statistics for records created in [range_start, range_end).
// Excludes soft-deleted records and soft-deleted related logs/items. Statuses
// are the latest remaining statuses at generation time, not historical
// snapshots. Updating an older task/incident does not add it to this cohort.
message OperationalReport {
  google.protobuf.Timestamp range_start = 1;
  google.protobuf.Timestamp range_end = 2;
  google.protobuf.Timestamp generated_at = 3;

  // Distinct cargos referenced by the matching movements' active items. A cargo
  // is counted once even when present in multiple movements. This is not the
  // number of registered cargos or a sum of quantities with different units.
  uint64 cargo_count = 4;
  uint64 task_count = 5;
  uint64 incident_count = 6;
  // Counts movement headers, not individual cargo items.
  uint64 movement_count = 7;

  // Each breakdown includes one entry per concrete status/type, including zero
  // counts. Its counts sum to the corresponding total above. These support
  // task progress, incident resolution and loading/unloading statistics.
  repeated ReportTaskStatusCount task_status_counts = 8;
  repeated ReportIncidentStatusCount incident_status_counts = 9;
  repeated ReportMovementTypeCount movement_type_counts = 10;
}

message ReportTaskStatusCount {
  harbour.types.v1.TaskStatus status = 1;
  uint64 count = 2;
}

message ReportIncidentStatusCount {
  harbour.types.v1.IncidentStatus status = 1;
  uint64 count = 2;
}

message ReportMovementTypeCount {
  harbour.types.v1.ShippingMovementType movement_type = 1;
  uint64 count = 2;
}

// One existing record for the detailed report. Uses the same creation-time
// filter, deletion rules and current-status semantics as OperationalReport.
message OperationalRecord {
  // The selected record's created_at, used for filtering and ordering.
  google.protobuf.Timestamp occurred_at = 1;
  oneof record {
    harbour.shipping.movement.v1.ShippingMovementSummary cargo_movement = 2;
    harbour.task.v1.TaskSummary task = 3;
    harbour.incident.v1.IncidentSummary incident = 4;
  }
}
