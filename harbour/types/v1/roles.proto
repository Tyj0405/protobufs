syntax = "proto3";

package harbour.types.v1;

import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";
import "harbour/types/v1/user.proto";
import "harbour/types/v1/policy.proto";

message RolePolicyCreate {
  ResourcePolicy resource = 1 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  PolicyAction action = 2 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
}

message RoleCreate {
  string name = 1 [(buf.validate.field).string.min_len = 1];
  optional string remark = 2 [(buf.validate.field).string.min_len = 1];
  repeated RolePolicy policies = 3;
}

message RolePolicy {
  ResourcePolicy resource = 1 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  PolicyAction action = 2 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  UserReference created_by = 3;
  google.protobuf.Timestamp created_at = 4;
}

message Role {
  int64 id = 1;
  string name = 2 [(buf.validate.field).string.min_len = 1];
  optional string remark = 3 [(buf.validate.field).string.min_len = 1];
  UserReference created_by = 4;
  google.protobuf.Timestamp created_at = 5;
  optional google.protobuf.Timestamp deleted_at = 6;
  repeated RolePolicy policies = 7;
}

