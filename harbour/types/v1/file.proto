syntax = "proto3";

package harbour.types.v1;

import "buf/validate/validate.proto";

message ImageEvidenceAttachment {
  int64 file_id = 1 [(buf.validate.field).int64.gt = 0];
  optional string remarks = 2;
}

message FileReference {
  int64 id = 1;
  string filename = 2;
  string url = 3;
  string mimetype = 4;
  int32 size_kb = 5;
}

message ImageEvidenceReference {
  FileReference file = 1;
  optional string remarks = 2;
}
