syntax = "proto3";

package harbour.types.v1;

import "buf/validate/validate.proto";

message PaginationRequest {
  // Zero uses the backend default. A non-zero value may not exceed 100.
  uint32 page_size = 1 [(buf.validate.field).uint32.lte = 100];
  // Number of matching records to skip before returning this page.
  uint64 offset = 2 [(buf.validate.field).uint64.lte = 9223372036854775807];
}

message PaginationResponse {
  // Total number of records matching the request filters.
  uint64 total_count = 1;
}
