syntax = "proto3";

package harbour.types.v1;

import "buf/validate/validate.proto";

message AddressCreate {
  string unit_no = 2 [(buf.validate.field).string.min_len = 1];
  string address_1 = 3 [(buf.validate.field).string.min_len = 1];
  optional string address_2 = 4 [(buf.validate.field).string.min_len = 1];
  optional string address_3 = 5 [(buf.validate.field).string.min_len = 1];
  string city = 6 [(buf.validate.field).string.min_len = 1];
  string state = 7 [(buf.validate.field).string.min_len = 1];
  string postcode = 8 [(buf.validate.field).string.min_len = 1];
  string country_code = 9 [(buf.validate.field).string.min_len = 1];
  optional bytes coordinate = 10;
}

message Address {
  int64 id = 1 [(buf.validate.field).int64.gt = 0];
  string unit_no = 2 [(buf.validate.field).string.min_len = 1];
  string address_1 = 3 [(buf.validate.field).string.min_len = 1];
  optional string address_2 = 4 [(buf.validate.field).string.min_len = 1];
  optional string address_3 = 5 [(buf.validate.field).string.min_len = 1];
  string city = 6 [(buf.validate.field).string.min_len = 1];
  string state = 7 [(buf.validate.field).string.min_len = 1];
  string postcode = 8 [(buf.validate.field).string.min_len = 1];
  string country_code = 9 [(buf.validate.field).string.min_len = 1];
  optional bytes coordinate = 10;
}

message AddressReference {
  int64 id = 1;
  string formatted_address = 2; // derived from the individual addresses table columns.
}
