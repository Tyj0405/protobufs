syntax = "proto3";

package harbour.types.v1;

import "google/protobuf/struct.proto";
import "harbour/types/v1/location.proto";
import "harbour/types/v1/user.proto";

message Dashboard {
  int64 id = 1;
  string name = 2;
  LocationReference port = 3;
  UserReference created_by = 4;
}

message DashboardLayout {
  int64 id = 1;
  string component = 2;
  string title = 3;
  uint32 position = 4;
  google.protobuf.Struct data = 5;
}
