syntax = "proto3";

package harbour.container.v1;

import "harbour/cargo/v1/get_cargo.proto";
import "harbour/types/v1/cargo.proto";
import "harbour/types/v1/container.proto";

message CargoContainerSummary {
  harbour.types.v1.CargoContainer info = 1;
  repeated harbour.types.v1.CargoReference cargos = 2;
  // TODO: add container yards relation
}

message CargoContainerDetails {
  harbour.types.v1.CargoContainer info = 1;
  repeated harbour.cargo.v1.CargoDetails cargos = 2;
  // TODO: add container yards relation
}
