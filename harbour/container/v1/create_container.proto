syntax = "proto3";

package harbour.container.v1;

import "buf/validate/validate.proto";

message CreateContainer {
  string cin = 1 [(buf.validate.field).string = {
    len: 11
    pattern: "^[A-Z]{4}[0-9]{7}$"
  }];
  int64 size_id = 2 [(buf.validate.field).int64.gt = 0];
  repeated int64 cargo_ids = 3 [
    (buf.validate.field).repeated.unique = true,
    (buf.validate.field).repeated.items.int64.gt = 0
  ];
}
