syntax = "proto3";

package harbour.tenant.v1;

import "harbour/account/v1/register_account.proto";
import "harbour/tenant/v1/register_tenant.proto";

service TenantService {
  rpc RegisterTenant(RegisterTenantRequest) returns (RegisterTenantResponse) {}
  rpc RequestTenantDeletion(RequestTenantDeletionRequest) returns (RequestTenantDeletionResponse) {}
}

message RegisterTenantRequest {
   harbour.tenant.v1.RegisterTenantInformation tenant = 1;
   harbour.account.v1.RegisterUser root_user = 2;
}

message RegisterTenantResponse {
}

message RequestTenantDeletionRequest {
  int64 tenant_id = 1;
}

message RequestTenantDeletionResponse {
}
