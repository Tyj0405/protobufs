syntax = "proto3";

package harbour.task.v1;

import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";
import "harbour/task/v1/get_task.proto";
import "harbour/types/v1/task.proto";

message TaskCalendarFilter {
  option (buf.validate.message).cel = {
    id: "task.calendar.valid_range"
    message: "calendar range_start must be before range_end"
    expression: "this.range_start < this.range_end"
  };

  google.protobuf.Timestamp range_start = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).timestamp = {}
  ];
  google.protobuf.Timestamp range_end = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).timestamp = {}
  ];
  repeated int64 port_id = 3 [(buf.validate.field).repeated.items.int64.gt = 0];
  repeated harbour.types.v1.TaskStatus latest_status = 4 [(buf.validate.field).repeated.items.enum = {
    defined_only: true
    not_in: 0
  }];
  repeated int64 assigned_user_id = 5 [(buf.validate.field).repeated.items.int64.gt = 0];
  optional string query = 6 [(buf.validate.field).string.max_len = 200];
}

message ListTaskCalendarRequest {
  TaskCalendarFilter filter = 1 [(buf.validate.field).required = true];
}

message ListTaskCalendarResponse {
  repeated TaskSummary results = 1;
}

message ExportTaskCalendarRequest {
  TaskCalendarFilter filter = 1 [(buf.validate.field).required = true];
}

message ExportTaskCalendarResponse {
  string filename = 1;
  string content_type = 2;
  bytes content = 3;
}
