syntax = "proto3";

package harbour.task.v1;

import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";

message CreateTask {
  int64 assigned_user_id = 1 [(buf.validate.field).int64.gt = 0];
  int64 port_id = 2 [(buf.validate.field).int64.gt = 0];
  string name = 3 [(buf.validate.field).string = {
    min_len: 1
    pattern: "(?s).*[^[:space:]].*"
  }];
  string description = 4 [(buf.validate.field).string = {
    min_len: 1
    pattern: "(?s).*[^[:space:]].*"
  }];

  // Absence represents the nullable tasks.start_at column.
  google.protobuf.Timestamp start_at = 5 [(buf.validate.field).timestamp = {}];
  google.protobuf.Timestamp end_at = 6 [
    (buf.validate.field).required = true,
    (buf.validate.field).timestamp = {}
  ];
}
