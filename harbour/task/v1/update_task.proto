syntax = "proto3";

package harbour.task.v1;

import "google/protobuf/timestamp.proto";

message UpdateTask {
  optional int64 assigned_user_id = 1;
  optional int64 port_id = 2;
  optional string name = 3;
  optional string description = 4;

  // Omit to keep the current start time. Select clear_start_at to store NULL.
  oneof start_at_update {
    google.protobuf.Timestamp start_at = 5;
    bool clear_start_at = 7;
  }

  // Omit to keep the current required end time.
  google.protobuf.Timestamp end_at = 6;
}
