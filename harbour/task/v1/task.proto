syntax = "proto3";

package harbour.task.v1;

import "google/protobuf/timestamp.proto";
import "harbour/common/v1/common.proto";

// TaskService supports the administrator desktop task list and the staff
// mobile assigned-task workflow.
service TaskService {
  // Returns tasks for one Port, with optional status, search, and assignee
  // filters. The backend must enforce which tasks the caller may view.
  rpc ListTasks(ListTasksRequest) returns (ListTasksResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // Returns one task together with its complete task-log history.
  rpc GetTask(GetTaskRequest) returns (GetTaskResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // Creates a task and its initial Pending log for the authenticated creator.
  rpc CreateTask(CreateTaskRequest) returns (CreateTaskResponse) {}

  // Adds a status/progress log. The newest log becomes the latest task status.
  rpc AppendTaskLog(AppendTaskLogRequest) returns (AppendTaskLogResponse) {}
}

message ListTasksRequest {
  int64 port_id = 1;

  // Filters by the status of the newest task log.
  optional TaskStatus latest_status = 2;

  // Searches the task name, description, or assignee username.
  optional string query = 3;

  // Used by the staff mobile view to request tasks assigned to one user.
  optional int64 assigned_user_id = 4;

  .harbour.common.v1.PaginationRequest pagination = 5;
}

message ListTasksResponse {
  repeated Task tasks = 1;
  .harbour.common.v1.PaginationResponse pagination = 2;
}

message GetTaskRequest {
  int64 task_id = 1;
}

message GetTaskResponse {
  TaskDetails details = 1;
}

message CreateTaskRequest {
  int64 assigned_user_id = 1;
  int64 port_id = 2;
  string name = 3;
  string description = 4;

  // Absence represents the nullable tasks.start_at column.
  google.protobuf.Timestamp start_at = 5;
  google.protobuf.Timestamp end_at = 6;
}

message CreateTaskResponse {
  TaskDetails details = 1;
}

message AppendTaskLogRequest {
  int64 task_id = 1;
  TaskStatus status = 2;
  string description = 3;
  optional string remarks = 4;
}

message AppendTaskLogResponse {
  TaskLog log = 1;
  TaskStatus latest_status = 2;
}

enum TaskStatus {
  TASK_STATUS_UNSPECIFIED = 0;
  TASK_STATUS_PENDING = 1;
  TASK_STATUS_ONGOING = 2;
  TASK_STATUS_COMPLETED = 3;
  TASK_STATUS_INCOMPLETE = 4;
}

message Task {
  int64 id = 1;
  .harbour.common.v1.UserReference assigned_user = 2;
  .harbour.common.v1.LocationReference port = 3;
  string name = 4;
  string description = 5;

  // start_at may be absent; end_at is required by the database.
  google.protobuf.Timestamp start_at = 6;
  google.protobuf.Timestamp end_at = 7;

  .harbour.common.v1.UserReference created_by = 8;
  google.protobuf.Timestamp created_at = 9;

  // Derived from the newest task_logs row; it is not a tasks table column.
  TaskStatus latest_status = 10;
}

message TaskDetails {
  Task task = 1;
  repeated TaskLog logs = 2;
}

message TaskLog {
  int64 id = 1;
  TaskStatus status = 2;
  string description = 3;
  optional string remarks = 4;
  google.protobuf.Timestamp created_at = 5;
  .harbour.common.v1.UserReference created_by = 6;
}
