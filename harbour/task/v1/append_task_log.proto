syntax = "proto3";

package harbour.task.v1;

import "buf/validate/validate.proto";
import "harbour/types/v1/task.proto";

message AppendTaskLog {
  harbour.types.v1.TaskStatus status = 1 [(buf.validate.field).enum = {
    defined_only: true
    not_in: 0
  }];
  string description = 2 [(buf.validate.field).string = {
    min_len: 1
    pattern: "(?s).*[^[:space:]].*"
  }];
  optional string remarks = 3;
}
